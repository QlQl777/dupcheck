<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중복확인 (폰용)</title>
<style>
:root{--bg:#f2f4f8;--card:#fff;--tx:#12161f;--sub:#566074;--bd:#cdd4e2;--bl:#0f52d9;--gr:#0e7f3c;--grbg:#e3f6ea;--rd:#c21f1f;--rdbg:#fdecec;--yl:#fff4d6}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--tx:#e8ecf4;--sub:#9aa5b8;--bd:#333c4d;--bl:#7aa5ff;--gr:#58d68d;--grbg:#16301f;--rd:#ff8a8a;--rdbg:#3a1d1f;--yl:#3b3317}}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;padding:12px;max-width:820px}
h1{font-size:18px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub{color:var(--sub);font-size:13px}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;cursor:pointer}
button.main{background:var(--bl);color:#fff;border-color:var(--bl);font-weight:700}
button:disabled,.btn.off{opacity:.45;pointer-events:none}
textarea{width:100%;min-height:170px;border:1px solid var(--bd);border-radius:10px;padding:10px;font:14px/1.4 inherit;background:var(--card);color:var(--tx);resize:vertical}
.chips button{padding:6px 12px;border-radius:99px;font-size:13px}
.chips button.on{background:var(--bl);color:#fff;border-color:var(--bl)}
.item{border:1px solid var(--bd);border-left:6px solid var(--bd);border-radius:10px;padding:9px 11px;margin:8px 0;background:var(--card)}
.item.ok{border-left-color:var(--gr);background:var(--grbg)}
.item.dup{border-left-color:var(--rd);background:var(--rdbg)}
.item.warn{background:var(--yl)}
.st{font-weight:700;font-size:14px}
.ok .st{color:var(--gr)}.dup .st{color:var(--rd)}
.t{margin-top:3px;word-break:break-all}
.o{margin-top:3px;color:var(--sub);font-size:13px;word-break:break-all}
.sum{font-weight:700}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:30%;background:var(--bl);animation:mv 1.2s infinite ease-in-out}
@keyframes mv{0%{margin-left:-30%}100%{margin-left:100%}}
</style></head><body>
<h1>📚 중복확인 (폰용)</h1>
<div class="card">
  <div id="stat" class="sub">엔진을 불러오는 중... (처음 한 번은 인터넷 연결이 필요하고 1분 정도 걸릴 수 있어요)</div>
  <div class="bar" id="bar"><i></i></div>
  <div class="row" style="margin-top:10px">
    <label class="btn off" id="flab">제목목록 txt 불러오기<input id="file" type="file" accept=".txt,text/plain,*/*" hidden></label>
  </div>
  <div class="sub" id="msg" style="margin-top:6px"></div>
</div>
<div class="card">
  <textarea id="paste" placeholder="여기에 인터넷 목록(제목들)을 붙여넣으세요"></textarea>
  <div class="row" style="margin-top:8px">
    <button class="main" id="go" disabled>비교하기</button>
    <button id="clr">지우기</button>
    <button id="pst" style="display:none">붙여넣기</button>
  </div>
</div>
<div class="card" id="resbox" style="display:none">
  <div class="sum" id="sum"></div>
  <div class="row chips" style="margin:8px 0">
    <button data-f="all" class="on">전체</button>
    <button data-f="ok">다운로드 가능</button>
    <button data-f="dup">중복</button>
    <button id="cp">다운로드 가능 제목 복사</button>
  </div>
  <div id="list"></div>
</div>

const CODEVER="134afe9236";
let py=null,DL=[],FILTER='all',ROWS=[],SUMTXT='';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function setStat(t,busy){$('stat').textContent=t;$('bar').style.display=busy?'block':'none'}
function decodeB64(b){const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(u)}

/* ---- 보관(IndexedDB): 제목목록 원문 + 분석 캐시 ---- */
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open('dupcheck',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function kvGet(k){try{const d=await idb();return await new Promise((ok,no)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}catch(e){return undefined}}
async function kvSet(k,v){try{const d=await idb();return await new Promise((ok,no)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok(true);t.onerror=()=>no(t.error)})}catch(e){return false}}

function decodeFile(buf){
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf).replace(/^\ufeff/,'')}catch(e){}
  try{return new TextDecoder('euc-kr').decode(buf)}catch(e){}
  return new TextDecoder('utf-8').decode(buf);
}
function nowStr(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}
function showCount(){
  const s=JSON.parse(py.globals.get('status_json')());
  setStat(s.count?('보유 목록 '+s.count.toLocaleString()+'개 · '+(s.src||'')+' · '+s.time):'보유 목록이 비어 있어요. 아래에서 제목목록 txt를 불러오세요.',false);
}

async function boot(){
  try{
    if(window.PYFAIL||typeof loadPyodide==='undefined'){throw new Error('엔진(Pyodide)을 내려받지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.')}
    py=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/'});
    py.globals.set('__file__','/home/pyodide/dup.py');
    py.runPython(decodeB64(PYB64));
    const saved=await kvGet('titles');
    if(saved&&saved.text){
      setStat('저장된 보유 목록을 불러오는 중...',true); await sleep(30);
      let n=-1;
      const c=await kvGet('cache');
      if(c&&c.ver===CODEVER&&c.data){n=py.globals.get('import_cache')(c.data,saved.src,saved.time)}
      if(n<0){
        setStat('보유 목록을 분석하는 중... (한 번만 오래 걸려요)',true); await sleep(30);
        n=py.globals.get('load_titles')(saved.text,saved.src);
        kvSet('cache',{ver:CODEVER,data:py.globals.get('export_cache')()});
      }
    }
    showCount();
    $('flab').classList.remove('off'); $('go').disabled=false;
  }catch(e){setStat('시작 실패: '+(e&&e.message||e),false);console.error(e)}
}

$('file').onchange=async e=>{
  const f=e.target.files[0]; if(!f||!py)return;
  $('msg').textContent='읽는 중...'; $('flab').classList.add('off'); $('go').disabled=true;
  try{
    const text=decodeFile(await f.arrayBuffer());
    setStat('보유 목록을 분석하는 중... (목록이 크면 1분쯤 걸려요)',true); await sleep(50);
    const src=f.name, when=nowStr();
    const n=py.globals.get('load_titles')(text,src);
    const ok1=await kvSet('titles',{text,src,time:when});
    await kvSet('cache',{ver:CODEVER,data:py.globals.get('export_cache')()});
    $('msg').textContent='불러오기 완료: '+n.toLocaleString()+'개'+(ok1?' (폰에 저장됨 - 다음엔 다시 안 불러와도 돼요)':' (저장 공간 부족: 다음엔 다시 불러와야 해요)');
    showCount();
  }catch(err){$('msg').textContent='실패: '+(err&&err.message||err);setStat('',false)}
  e.target.value=''; $('flab').classList.remove('off'); $('go').disabled=false;
};

function render(){
  const list=$('list'); list.innerHTML='';
  document.querySelectorAll('.chips button[data-f]').forEach(b=>b.classList.toggle('on',b.dataset.f===FILTER));
  ROWS.forEach(r=>{
    if(FILTER!=='all'&&r.kind!==FILTER)return;
    const d=document.createElement('div'); d.className='item '+r.kind+(r.warn?' warn':'');
    let h='<div class="st">'+esc(r.status)+'</div><div class="t">'+esc(r.title)+(r.psize?' <span class="sub">('+esc(r.psize)+')</span>':'')+'</div>';
    r.olds.forEach(o=>{h+='<div class="o">기존 · '+esc(o)+'</div>'});
    d.innerHTML=h; list.appendChild(d);
  });
}
$('go').onclick=async()=>{
  const text=$('paste').value; if(!text.trim()){alert('비교할 목록을 붙여넣어 주세요');return}
  try{localStorage.setItem('paste',text)}catch(e){}
  $('go').disabled=true; $('go').textContent='비교 중...'; await sleep(30);
  try{
    const j=JSON.parse(py.globals.get('compare_json')(text));
    if(!j.ok){alert(j.error);return}
    ROWS=j.rows; DL=j.downloadable||[];
    $('resbox').style.display='block';
    $('sum').textContent='다운로드 가능 '+j.n_ok+'개 / 중복 다운금지 '+j.n_dup+'개'+((j.notice&&j.notice.length)?(' · '+j.notice.join(' ')):'');
    SUMTXT=$('sum').textContent; FILTER='all'; render(); saveResult(); $('resbox').scrollIntoView({behavior:'smooth'});
  }catch(err){alert('오류: '+(err&&err.message||err))}
  finally{$('go').disabled=false; $('go').textContent='비교하기'}
};
$('clr').onclick=()=>{$('paste').value='';$('resbox').style.display='none';ROWS=[];DL=[];kvSet('result',null);try{localStorage.removeItem('paste')}catch(e){}};
document.querySelectorAll('.chips button[data-f]').forEach(b=>b.onclick=()=>{FILTER=b.dataset.f;render()});
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(t)}
  return new Promise((ok,no)=>{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.focus();a.select();
    try{document.execCommand('copy')?ok():no()}catch(e){no(e)}a.remove()});
}
$('cp').onclick=()=>{
  if(!DL.length){alert('다운로드 가능한 항목이 없어요');return}
  copyText(DL.join('\n')).then(()=>{$('cp').textContent='복사됨 ✓';setTimeout(()=>$('cp').textContent='다운로드 가능 제목 복사',1500)},()=>alert('복사하지 못했어요'));
};
if(navigator.clipboard&&navigator.clipboard.readText&&window.isSecureContext){
  $('pst').style.display='';
  $('pst').onclick=async()=>{try{$('paste').value=await navigator.clipboard.readText()}catch(e){alert('붙여넣기 권한이 없어요')}};
}
try{const v=localStorage.getItem('paste'); if(v)$('paste').value=v}catch(e){}

/* ---- 내용 유지: 붙여넣기 자동저장 / 결과 즉시 복원 ---- */
async function saveResult(){try{await kvSet('result',{rows:ROWS,dl:DL,sum:SUMTXT,time:nowStr()})}catch(e){}}
async function restoreResult(){
  try{
    const r=await kvGet('result');
    if(r&&r.rows&&r.rows.length){
      ROWS=r.rows; DL=r.dl||[]; SUMTXT=r.sum||'';
      $('resbox').style.display='block';
      $('sum').textContent=SUMTXT+' · 저장된 결과('+(r.time||'')+')';
      FILTER='all'; render();
    }
  }catch(e){}
}
let _pt=null;
function savePaste(){try{localStorage.setItem('paste',$('paste').value)}catch(e){}}
$('paste').addEventListener('input',()=>{clearTimeout(_pt);_pt=setTimeout(savePaste,300)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')savePaste()});
window.addEventListener('pagehide',savePaste);
restoreResult();
